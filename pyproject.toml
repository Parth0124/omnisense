# =============================================================================
# Tool configuration only.
#
# Dependencies live in requirements.txt / requirements-dev.txt (pip workflow).
# There is deliberately no [project] or [build-system] table here - OmniSense is
# run from the repository root, not installed as a distributable package.
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
exclude = [
    ".venv", "venv", "build", "dist",
    "frontend", "migrations/versions", "node_modules",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC",# flake8-async
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length is enforced by the formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = [
    "agents", "backend", "connectors", "graph",
    "models", "prompts", "retrieval", "services", "workers",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["^frontend/", "^migrations/versions/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = [
    "aiokafka.*", "langdetect.*", "trafilatura.*",
    "feedparser.*", "opensearchpy.*", "factory.*",
    # boto3/botocore ship no py.typed marker; the typed surface lives in the
    # separate boto3-stubs package, which is deliberately not a dependency.
    "boto3.*", "botocore.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "unit: fast, isolated, no external services",
    "integration: requires docker-compose services to be running",
    "e2e: full investigation flow, slow",
    "eval: agent quality evaluation, non-blocking",
]
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = [
    "agents", "backend", "connectors", "graph",
    "models", "retrieval", "services", "workers",
]
omit = ["*/__init__.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
