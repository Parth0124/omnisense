# =============================================================================
# Tool configuration only.
#
# Dependencies live in requirements.txt / requirements-dev.txt (pip workflow).
# There is deliberately no [project] or [build-system] table here - OmniSense is
# run from the repository root, not installed as a distributable package.
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
exclude = [
    ".venv", "venv", "build", "dist",
    "frontend", "migrations/versions", "node_modules",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ASYNC",# flake8-async
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length is enforced by the formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = [
    "agents", "backend", "cli", "connectors", "graph",
    "models", "prompts", "retrieval", "services", "workers",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["^frontend/", "^migrations/versions/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = [
    "aiokafka.*", "langdetect.*", "trafilatura.*",
    "feedparser.*", "opensearchpy.*", "factory.*",
    # boto3/botocore ship no py.typed marker; the typed surface lives in the
    # separate boto3-stubs package, which is deliberately not a dependency.
    "boto3.*", "botocore.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "unit: fast, isolated, no external services",
    "integration: requires docker-compose services to be running",
    "e2e: full investigation flow, slow",
    "eval: agent quality evaluation, non-blocking",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # `PendingDeprecationWarning` is a sibling of `DeprecationWarning`, not a
    # subclass, so the line above does not cover it. LangChain raises
    # `LangChainPendingDeprecationWarning` on import about a future default we do
    # not control; under `error` that turned an unrelated test into a failure,
    # and only under full-suite ordering, because the import is lazy.
    "ignore::PendingDeprecationWarning",
    # asyncio's own self-pipe socketpair. Synchronous tests that call
    # `asyncio.run()` create and close a loop per call; on macOS the selector's
    # internal AF_UNIX socketpair is left to the garbage collector rather than
    # closed with the loop, so CPython emits `unclosed <socket.socket ...>`.
    #
    # Scoped to that exact message rather than to `ResourceWarning` as a class:
    # an unclosed httpx, Redis, Neo4j or Qdrant client -- something we actually
    # own and have disposal tests for -- still fails the suite.
    "ignore:unclosed <socket.socket:ResourceWarning",
    # pytest re-raises the above as its own wrapper warning, so the ResourceWarning
    # filter alone does not catch it. A pytest filter uses `:` as its field
    # separator and offers no way to escape one, so the message pattern cannot
    # reach past "Exception ignored in" to name the socket -- this is therefore
    # broader than intended, and the limitation is pytest's, not a choice.
    #
    # What still protects us: `backend/db/*` each own a `dispose_*()` with a
    # dedicated test, and `tests/unit/agents/conftest.py` forces collection
    # between tests so any leak is attributed to the test that caused it rather
    # than to a bystander. The proper fix is to convert the synchronous
    # `asyncio.run()` call sites in tests/unit/agents to async tests and let
    # pytest-asyncio own one loop; tracked as follow-up.
    "ignore:Exception ignored in:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = [
    "agents", "backend", "connectors", "graph",
    "models", "retrieval", "services", "workers",
]
omit = ["*/__init__.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
