# Alembic configuration for OmniSense.
# Run from the repository root:
#   alembic -c migrations/alembic.ini upgrade head
#
# The database URL is intentionally left blank here - it is read from the
# DATABASE_URL environment variable in migrations/env.py so that credentials
# never live in a tracked file.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
sqlalchemy.url =

[post_write_hooks]
# `exec` rather than `console_scripts`: the latter resolves the entry point from
# the *running* interpreter's installed distributions, and ruff ships as a
# prebuilt binary with no console-script entry point to find. Every autogenerate
# ended in "Could not find entrypoint console_scripts.ruff" -- after writing the
# file, so the migration was fine and only the formatting was skipped, which is
# the sort of failure that gets ignored until someone believes the hook works.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = %(here)s/../.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
